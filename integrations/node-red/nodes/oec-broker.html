<script type="text/javascript">
  RED.nodes.registerType('oec-broker', {
    category: 'config',
    defaults: {
      name: { value: '' },
      mode: { value: 'container', required: true },
      root: { value: '/' },
      host: { value: '', validate: function (v) { return this.mode !== 'manual' || !!v; } },
      port: { value: 8883, validate: RED.validators.number(true) },
      tls: { value: true },
      tlsConfig: { type: 'tls-config', required: false },
      clientId: { value: '' },
      maxPacketSize: { value: 262144, validate: RED.validators.number(true) },
    },
    credentials: {
      username: { type: 'text' },
      password: { type: 'password' },
    },
    label: function () {
      if (this.name) return this.name;
      return this.mode === 'manual' ? `${this.host || 'broker'}:${this.port || 8883}` : 'container storage';
    },
    oneditprepare: function () {
      const toggle = function () {
        const manual = $('#node-config-input-mode').val() === 'manual';
        $('.oec-broker-manual').toggle(manual);
        $('.oec-broker-container').toggle(!manual);
        $('.oec-broker-tls').toggle(manual && $('#node-config-input-tls').is(':checked'));
      };
      $('#node-config-input-mode').on('change', toggle);
      $('#node-config-input-tls').on('change', toggle);
      toggle();
    },
  });
</script>

<script type="text/html" data-template-name="oec-broker">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-config-input-mode"><i class="fa fa-cog"></i> Source</label>
    <select id="node-config-input-mode" style="width:70%">
      <option value="container">container storage (RIG 4.1.3)</option>
      <option value="manual">set by hand</option>
    </select>
  </div>
  <div class="form-row oec-broker-container">
    <label for="node-config-input-root"><i class="fa fa-folder"></i> Root</label>
    <input type="text" id="node-config-input-root" placeholder="/">
  </div>
  <div class="form-row oec-broker-manual">
    <label for="node-config-input-host"><i class="fa fa-server"></i> Host</label>
    <input type="text" id="node-config-input-host" placeholder="broker.example.com" style="width:45%">
    <label for="node-config-input-port" style="margin-left:10px;width:40px">Port</label>
    <input type="text" id="node-config-input-port" style="width:65px">
  </div>
  <div class="form-row oec-broker-manual">
    <input type="checkbox" id="node-config-input-tls" style="display:inline-block;width:auto;vertical-align:top">
    <label for="node-config-input-tls" style="width:auto">TLS (required by the guideline)</label>
  </div>
  <div class="form-row oec-broker-tls">
    <label for="node-config-input-tlsConfig"><i class="fa fa-lock"></i> TLS</label>
    <input type="text" id="node-config-input-tlsConfig">
  </div>
  <div class="form-row oec-broker-manual">
    <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
    <input type="text" id="node-config-input-username">
  </div>
  <div class="form-row oec-broker-manual">
    <label for="node-config-input-password"><i class="fa fa-key"></i> Password</label>
    <input type="password" id="node-config-input-password">
  </div>
  <div class="form-row oec-broker-manual">
    <label for="node-config-input-maxPacketSize"><i class="fa fa-arrows-h"></i> Max. packet</label>
    <input type="text" id="node-config-input-maxPacketSize" style="width:100px"> octets
  </div>
  <div class="form-row oec-broker-manual">
    <label for="node-config-input-clientId"><i class="fa fa-id-card"></i> ClientId</label>
    <input type="text" id="node-config-input-clientId" placeholder="derived from the Identification Link">
  </div>
</script>

<script type="text/html" data-help-name="oec-broker">
  <p>The MQTT broker of the OEC message bus.</p>
  <h3>Source</h3>
  <dl class="message-properties">
    <dt>container storage</dt>
    <dd>Reads the broker from the container storage of the OEC Runtime &amp; Infrastructure Guideline below
      <i>Root</i> (<code>/</code> in an OEC container): <code>etc/oi4/mqtt/broker.json</code>, the CA
      <code>etc/oi4/mqtt/broker_ca.pem</code> or <code>etc/oi4/certs/ca.pem</code>, and either the client
      certificate <code>etc/oi4/certs/&lt;container name&gt;.pem</code> with
      <code>run/secrets/oi4/private_key.pem</code> or the credentials <code>run/secrets/oi4/credentials</code>.
      The container name is the ClientId; further applications of the same broker node add a suffix.</dd>
    <dt>set by hand</dt>
    <dd>Host, port, TLS settings and credentials. Without a ClientId one is derived from the
      Identification Link of the application.</dd>
  </dl>
  <p>The connection uses MQTT 3.1.1, a clean session, keepalive 60 s and TLS 1.2 or higher.</p>
</script>
