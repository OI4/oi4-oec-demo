# The config service D10 of P6 (ADR-0028 §7, A-304): an own Cargo package
# outside the SDK workspace, on the Rust SDK `oec` by path, with its own
# Cargo.lock and the cargo-deny policy of the SDK (oec/sdk/rust/deny.toml).
# Dependencies within ADR-0023: only crates the SDK already uses.
[package]
name = "oec-config"
description = "OEC config service (D10): discovers the OEC applications on the bus, reads their Config and SubscriptionList and edits writable Configs with Set Config."
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
repository = "https://github.com/OI4/oec"

# Its own workspace: not a member of oec/sdk/rust.
[workspace]

[[bin]]
name = "oec-config"
path = "src/main.rs"

[dependencies]
oec = { path = "../../sdk/rust/oec" }
serde_json = "1"
log = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
